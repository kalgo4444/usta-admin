services:
  admin:
    build: .
    image: usta-admin
    restart: unless-stopped
    ports:
      - '${PORT:-4010}:${PORT:-4010}'
    environment:
      # The standalone server listens on this port inside the container too.
      PORT: ${PORT:-4010}
      # Backend origin (runtime, server-only, required: the server refuses to start without it).
      API_URL: ${API_URL:?API_URL is required}
    healthcheck:
      # $$ defers expansion to the container shell.
      test: ['CMD-SHELL', 'wget -qO- "http://127.0.0.1:$${PORT}/api/health"']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
